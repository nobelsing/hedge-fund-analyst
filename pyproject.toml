[project]
name = "hedge-fund-analyst"
version = "0.1.0"
description = "AI Hedge Fund Analyst - Multi-Agent System using Google ADK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
